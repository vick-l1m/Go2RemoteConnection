<!--
go2_map_viewer.html

This file provides the Go2 map viewer interface.
It includes:
- shared login/auth overlay
- shared navigation and health/safety controls
- stand/sit actions
- 2D occupancy map display over WebSocket
- dual joystick teleoperation beneath the map

Version 2.0
Author: Victor Lim
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go2 Map Viewer</title>

  <link rel="stylesheet" href="/app/static/shared.css" />
  <script src="/app/static/shared.js"></script>

  <style>
    .mapPanel {
      margin-top: 12px;
      border: 1px solid var(--soft-border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .mapHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--soft-2);
      border-bottom: 1px solid var(--soft-border);
    }

    .mapTitle {
      font-size: 14px;
      font-weight: 600;
    }

    .mapHint {
      color: #777;
      font-size: 13px;
    }

    .mapBox {
      padding: 12px;
      height: 72vh;
      min-height: 520px;
    }

    #mapCanvas {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      background: #fff;
      touch-action: none;
    }
  </style>

  <script>
    let mapWs = null;
    let mapState = {
      width: 0,
      height: 0,
      resolution: 0,
      origin_x: 0,
      origin_y: 0,
      frame_id: "",
      imageData: null,
      offscreen: null,
      offctx: null,
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      dragging: false,
      lastX: 0,
      lastY: 0,
    };

    let latest = { lx: 0, ly: 0, rx: 0, ry: 0 };
    let teleopTimer = null;
    let safetyLatched = false;

    window.addEventListener("DOMContentLoaded", async () => {
      await Go2Shared.init({ defaultApi: "", showAuthButtons: true });
      setTimeout(refreshSafetyStatus, 200);
      initMapCanvas();
      initJoysticks();
    });

    async function loginAndStart() {
      await Go2Shared.login();
      if (Go2Shared.ensureLoggedIn()) startMap();
    }

    function wsUrl(path) {
      const token = encodeURIComponent(Go2Shared.state.AUTH_TOKEN || "");
      return `${Go2Shared.apiWsBase()}${path}?token=${token}`;
    }

    async function postAction(action) {
      const r = await Go2Shared.httpPost(`/actions/${action}`);
      Go2Shared.setStatus(
        r.ok ? `Action sent: ${action}` : `Action failed: ${action}`,
        r.ok,
        `URL: ${r.url}\n${r.text}`
      );
    }

    async function toggleSafety() {
      if (!safetyLatched && !(await Go2Shared.confirmStop())) return;   // confirm before damping
      const path = safetyLatched ? "/safety/resume" : "/safety/stop";
      const r = await Go2Shared.httpPost(path, null, { bypassCommsGate: true });

      Go2Shared.setStatus(
        r.ok ? (safetyLatched ? "RESUME sent ✅" : "STOP sent ✅") : "Safety command failed",
        r.ok,
        `URL: ${r.url}\n${r.text}`
      );

      await refreshSafetyStatus();
    }

    async function refreshSafetyStatus() {
      const r = await Go2Shared.httpGet("/safety/status", { bypassCommsGate: true });
      if (!r.ok) return;

      try {
        const data = JSON.parse(r.text);
        safetyLatched = !!data.stop_latched;
        Go2Shared.state.COMMS_ENABLED = !safetyLatched;

        const btn = document.getElementById("safetyToggleBtn");
        if (btn) {
          btn.textContent = safetyLatched ? "RESUME" : "STOP";
          btn.classList.toggle("danger", !safetyLatched);
          btn.classList.toggle("activeMode", safetyLatched);
        }
      } catch (_) {}
    }

    async function startMap() {
      if (!Go2Shared.ensureLoggedIn()) return;

      stopMap();

      mapWs = new WebSocket(wsUrl("/ws/map2d"));
      mapWs.binaryType = "arraybuffer";

      let pendingHeader = null;

      mapWs.onopen = () => {
        Go2Shared.setStatus("Map connected ✅", true);
        mapWs._keepalive = setInterval(() => {
          if (mapWs && mapWs.readyState === WebSocket.OPEN) mapWs.send("ping");
        }, 1000);
      };

      mapWs.onmessage = async (ev) => {
        if (typeof ev.data === "string") {
          pendingHeader = JSON.parse(ev.data);
          return;
        }

        if (!(ev.data instanceof ArrayBuffer) || !pendingHeader) return;

        if (pendingHeader.t === "f") {
          await applyFullMap(pendingHeader.meta, ev.data);
          pendingHeader = null;
        }
      };

      mapWs.onclose = (ev) => {
        if (mapWs && mapWs._keepalive) clearInterval(mapWs._keepalive);
        Go2Shared.setStatus(`Map closed (${ev.code})`, false);
      };

      mapWs.onerror = () => {
        Go2Shared.setStatus("Map WebSocket error", false);
      };
    }

    function stopMap() {
      if (mapWs) {
        try {
          if (mapWs._keepalive) clearInterval(mapWs._keepalive);
          mapWs.close();
        } catch (_) {}
        mapWs = null;
      }
    }

    async function applyFullMap(meta, gzBuffer) {
      const ds = new DecompressionStream("gzip");
      const decompressed = await new Response(
        new Blob([gzBuffer]).stream().pipeThrough(ds)
      ).arrayBuffer();

      const raw = new Int8Array(decompressed);
      const w = meta.width;
      const h = meta.height;

      const offscreen = document.createElement("canvas");
      offscreen.width = w;
      offscreen.height = h;
      const offctx = offscreen.getContext("2d");
      const imageData = offctx.createImageData(w, h);

      for (let i = 0; i < raw.length; i++) {
        const occ = raw[i];
        const p = i * 4;

        let v = 255;
        if (occ === -1) v = 205;
        else v = 255 - Math.round((occ / 100) * 255);

        imageData.data[p + 0] = v;
        imageData.data[p + 1] = v;
        imageData.data[p + 2] = v;
        imageData.data[p + 3] = 255;
      }

      offctx.putImageData(imageData, 0, 0);

      mapState.width = w;
      mapState.height = h;
      mapState.resolution = meta.resolution;
      mapState.origin_x = meta.origin_x;
      mapState.origin_y = meta.origin_y;
      mapState.frame_id = meta.frame_id;
      mapState.imageData = imageData;
      mapState.offscreen = offscreen;
      mapState.offctx = offctx;

      fitMapToView();
      drawMap();
    }

    function initMapCanvas() {
      const canvas = document.getElementById("mapCanvas");
      const ctx = canvas.getContext("2d");

      function resize() {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
        drawMap();
      }

      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        mapState.scale *= factor;
        drawMap();
      }, { passive: false });

      canvas.addEventListener("pointerdown", (e) => {
        mapState.dragging = true;
        mapState.lastX = e.clientX;
        mapState.lastY = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!mapState.dragging) return;
        mapState.offsetX += e.clientX - mapState.lastX;
        mapState.offsetY += e.clientY - mapState.lastY;
        mapState.lastX = e.clientX;
        mapState.lastY = e.clientY;
        drawMap();
      });

      canvas.addEventListener("pointerup", () => { mapState.dragging = false; });
      canvas.addEventListener("pointercancel", () => { mapState.dragging = false; });

      window.addEventListener("resize", resize);
      resize();
    }

    function fitMapToView() {
      const canvas = document.getElementById("mapCanvas");
      const rect = canvas.getBoundingClientRect();
      if (!mapState.width || !mapState.height || !rect.width || !rect.height) return;

      const sx = rect.width / mapState.width;
      const sy = rect.height / mapState.height;
      mapState.scale = Math.min(sx, sy);
      mapState.offsetX = (rect.width - mapState.width * mapState.scale) / 2;
      mapState.offsetY = (rect.height - mapState.height * mapState.scale) / 2;
    }

    function drawMap() {
      const canvas = document.getElementById("mapCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();

      ctx.clearRect(0, 0, rect.width, rect.height);

      if (!mapState.offscreen) return;

      ctx.drawImage(
        mapState.offscreen,
        0,
        0,
        mapState.width,
        mapState.height,
        mapState.offsetX,
        mapState.offsetY,
        mapState.width * mapState.scale,
        mapState.height * mapState.scale
      );
    }

    function initJoysticks() {
      Go2Shared.createJoystick("joyLeft", (x, y, active) => {
        latest.lx = active ? x : 0;
        latest.ly = active ? y : 0;
      });

      Go2Shared.createJoystick("joyRight", (x, y, active) => {
        latest.rx = active ? x : 0;
        latest.ry = active ? y : 0;
      });

      if (teleopTimer) clearInterval(teleopTimer);
      teleopTimer = setInterval(sendTeleop, 120);
    }

    async function sendTeleop() {
      if (!Go2Shared.ensureLoggedIn()) return;
      if (!Go2Shared.state.COMMS_ENABLED) return;

      const cmd = {
        linear_x: -latest.ly * 0.6,
        linear_y: latest.lx * 0.6,
        angular_z: latest.rx * 1.2,
      };

      await Go2Shared.httpPost("/teleop", cmd);
    }
  </script>
</head>

<body>
  <div id="loginOverlay" class="loginOverlay">
    <div class="loginCard">
      <h2>Connect to Go2</h2>
      <div class="loginForm">
        <input id="loginBaseUrl" placeholder="http://robot-ip:8000 or https://robot.domain" />
        <input id="loginToken" placeholder="Password" type="password" />
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#333;">
          <input id="showPw" type="checkbox" onclick="Go2Shared.togglePasswordVisibility()" />
          Show password
        </label>
        <button id="unlockBtn" onclick="loginAndStart()">Unlock</button>
        <div id="loginMsg" class="loginMsg"></div>
        <div class="loginTip">Tip: This password is unique per robot.</div>
      </div>
    </div>
  </div>

  <div id="appRoot">
    <div class="card">
      <h1>Unitree Go2 – Map Viewer</h1>

      <div class="row">
        <input id="baseUrl" placeholder="http://<go2-ip>:8000" />
        <button onclick="Go2Shared.checkHealth()">Health</button>
        <button onclick="postAction('stand')">Stand</button>
        <button onclick="postAction('sit')">Sit</button>
        <button id="safetyToggleBtn" class="danger" onclick="toggleSafety()">STOP</button>
        <button onclick="startMap()">Start map</button>
        <button onclick="stopMap()">Stop map</button>
        <button onclick="Go2Shared.logout()">Logout</button>
      </div>

      <div class="mapPanel">
        <div class="mapHeader">
          <div class="mapTitle">2D Occupancy Map</div>
          <div class="mapHint">WebSocket: /ws/map2d</div>
        </div>
        <div class="mapBox">
          <canvas id="mapCanvas"></canvas>
        </div>
      </div>

      <div class="joyRow">
        <div class="joyBox">
          <div class="joyTitle">Move (X/Y)</div>
          <canvas id="joyLeft" class="joyCanvas"></canvas>
        </div>
        <div class="joyBox">
          <div class="joyTitle">Turn</div>
          <canvas id="joyRight" class="joyCanvas"></canvas>
        </div>
      </div>

      <div class="status">
        <div id="msg" class="small">Ready.</div>
        <div id="detail" class="mono"></div>
      </div>
    </div>
  </div>
</body>
</html>
