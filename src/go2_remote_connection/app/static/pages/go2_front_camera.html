<!--
go2_front_camera.html

This file provides the Go2 front camera web interface.
It includes:
- shared login/auth overlay
- shared navigation and health/safety controls
- stand/sit/stop-resume controls
- dual joystick teleoperation
- live front camera stream over WebSocket

Version 2.0
Author: Victor Lim
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Go2 Front Camera</title>

  <link rel="stylesheet" href="/app/static/shared.css" />
  <script src="/app/static/shared.js"></script>

  <style>
    .camPanel {
      margin-top: 12px;
      border: 1px solid var(--soft-border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .camHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--soft-2);
      border-bottom: 1px solid var(--soft-border);
    }

    .camTitle {
      font-size: 14px;
      font-weight: 600;
    }

    .camHint {
      color: #777;
      font-size: 13px;
    }

    .camViewport {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    #camImg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    @media (min-width: 1200px) {
      .camViewport {
        max-width: 920px;
        margin: 0 auto;
      }
    }
  </style>

  <script>
    let camWs = null;
    let latest = { lx: 0, ly: 0, rx: 0, ry: 0 };
    let teleopTimer = null;
    let safetyLatched = false;

    window.addEventListener("DOMContentLoaded", async () => {
      await Go2Shared.init({ defaultApi: "", showAuthButtons: true });
      setTimeout(refreshSafetyStatus, 200);
      initJoysticks();
    });

    async function loginAndStart() {
      await Go2Shared.login();
      if (Go2Shared.ensureLoggedIn()) startStream();
    }

    function wsUrl(path) {
      const token = encodeURIComponent(Go2Shared.state.AUTH_TOKEN || "");
      return `${Go2Shared.apiWsBase()}${path}?token=${token}`;
    }

    function startStream() {
      if (!Go2Shared.ensureLoggedIn()) return;

      stopStream();

      const img = document.getElementById("camImg");
      const msg = document.getElementById("msg");
      const detail = document.getElementById("detail");

      try {
        camWs = new WebSocket(wsUrl("/ws/cam_front"));
        camWs.binaryType = "arraybuffer";

        let waitingForFrame = false;

        camWs.onopen = () => {
          Go2Shared.setStatus("Front camera connected ✅", true);
          const keepalive = () => {
            if (camWs && camWs.readyState === WebSocket.OPEN) camWs.send("ping");
          };
          camWs._keepalive = setInterval(keepalive, 1000);
        };

        camWs.onmessage = (ev) => {
          if (typeof ev.data === "string") {
            waitingForFrame = true;
            return;
          }

          if (waitingForFrame && ev.data instanceof ArrayBuffer) {
            const blob = new Blob([ev.data], { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);
            const prev = img.dataset.blobUrl;
            img.src = url;
            img.dataset.blobUrl = url;
            if (prev) URL.revokeObjectURL(prev);
            waitingForFrame = false;
          }
        };

        camWs.onclose = (ev) => {
          if (camWs && camWs._keepalive) clearInterval(camWs._keepalive);
          Go2Shared.setStatus(`Front camera closed (${ev.code})`, false);
          detail.textContent = `WebSocket closed with code ${ev.code}`;
        };

        camWs.onerror = () => {
          Go2Shared.setStatus("Front camera WebSocket error", false);
        };
      } catch (err) {
        msg.textContent = "Failed to start camera stream";
        detail.textContent = String(err);
      }
    }

    function stopStream() {
      if (camWs) {
        try {
          if (camWs._keepalive) clearInterval(camWs._keepalive);
          camWs.close();
        } catch (_) {}
        camWs = null;
      }
    }

    async function postAction(action) {
      const r = await Go2Shared.httpPost(`/actions/${action}`);
      Go2Shared.setStatus(
        r.ok ? `Action sent: ${action}` : `Action failed: ${action}`,
        r.ok,
        `URL: ${r.url}\n${r.text}`
      );
    }

    async function toggleSafety() {
      const path = safetyLatched ? "/safety/resume" : "/safety/stop";
      const r = await Go2Shared.httpPost(path, null, { bypassCommsGate: true });

      Go2Shared.setStatus(
        r.ok ? (safetyLatched ? "RESUME sent ✅" : "STOP sent ✅") : "Safety command failed",
        r.ok,
        `URL: ${r.url}\n${r.text}`
      );

      await refreshSafetyStatus();
    }

    async function refreshSafetyStatus() {
      const r = await Go2Shared.httpGet("/safety/status", { bypassCommsGate: true });
      if (!r.ok) return;

      try {
        const data = JSON.parse(r.text);
        safetyLatched = !!data.stop_latched;
        Go2Shared.state.COMMS_ENABLED = !safetyLatched;

        const btn = document.getElementById("safetyToggleBtn");
        if (btn) {
          btn.textContent = safetyLatched ? "RESUME" : "STOP";
          btn.classList.toggle("danger", !safetyLatched);
          btn.classList.toggle("activeMode", safetyLatched);
        }
      } catch (_) {}
    }

    function initJoysticks() {
      Go2Shared.createJoystick("joyLeft", (x, y, active) => {
        latest.lx = active ? x : 0;
        latest.ly = active ? y : 0;
      });

      Go2Shared.createJoystick("joyRight", (x, y, active) => {
        latest.rx = active ? x : 0;
        latest.ry = active ? y : 0;
      });

      if (teleopTimer) clearInterval(teleopTimer);
      teleopTimer = setInterval(sendTeleop, 120);
  }

    async function sendTeleop() {
      if (!Go2Shared.ensureLoggedIn()) return;
      if (!Go2Shared.state.COMMS_ENABLED) return;

      const cmd = {
        linear_x: -latest.ly * 0.6,
        linear_y: latest.lx * 0.6,
        angular_z: latest.rx * 1.2,
      };

      await Go2Shared.httpPost("/teleop", cmd);
    }
  </script>
</head>

<body>
  <div id="loginOverlay" class="loginOverlay">
    <div class="loginCard">
      <h2>Connect to Go2</h2>
      <div class="loginForm">
        <input id="loginBaseUrl" placeholder="http://robot-ip:8000 or https://robot.domain" />        <input id="loginToken" placeholder="Password" type="password" />
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#333;">
          <input id="showPw" type="checkbox" onclick="Go2Shared.togglePasswordVisibility()" />
          Show password
        </label>
        <button id="unlockBtn" onclick="loginAndStart()">Unlock</button>
        <div id="loginMsg" class="loginMsg"></div>
        <div class="loginTip">Tip: This password is unique per robot.</div>
      </div>
    </div>
  </div>

  <div id="appRoot">
    <div class="card">
      <h1>Unitree Go2 – Front Camera</h1>

      <div class="row">
        <button onclick="Go2Shared.checkHealth()">Health</button>
        <button onclick="postAction('stand')">Stand</button>
        <button onclick="postAction('sit')">Sit</button>
        <button id="safetyToggleBtn" class="danger" onclick="toggleSafety()">STOP</button>
        <button onclick="startStream()">Start camera</button>
        <button onclick="stopStream()">Stop camera</button>
        <button onclick="Go2Shared.logout()">Logout</button>
      </div>

      <div class="camPanel">
        <div class="camHeader">
          <div class="camTitle">Front Camera Stream</div>
          <div class="camHint">WebSocket: /ws/cam_front</div>
        </div>
        <div class="camViewport">
          <img id="camImg" alt="Front camera stream" />
        </div>
      </div>

      <div class="joyRow">
        <div class="joyBox">
          <div class="joyTitle">Move (X/Y)</div>
          <canvas id="joyLeft" class="joyCanvas"></canvas>
        </div>
        <div class="joyBox">
          <div class="joyTitle">Turn</div>
          <canvas id="joyRight" class="joyCanvas"></canvas>
        </div>
      </div>

      <div class="status">
        <div id="msg" class="small">Ready.</div>
        <div id="detail" class="mono"></div>
      </div>
    </div>
  </div>
</body>
</html>
